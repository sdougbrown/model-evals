# Classifier: gemma4 reasoning=high (distinct id to avoid promptfoo id-dedup)
description: "Classifier: gemma4 reasoning=high"

evaluateOptions:
  maxConcurrency: 3

providers:
  - id: openai:chat:gemma4
    label: gemma4 (reasoning=high)
    config:
      apiBaseUrl: "http://localhost:4000/v1"
      apiKey: none
      model: gemma4
      reasoning: high
      max_tokens: 4096

prompts:
  - file://prompt.js

tests: file://tests.yaml
