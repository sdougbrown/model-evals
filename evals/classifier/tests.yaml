- description: 'avenor/34: requestID timer closure — user claims false positive, accepted'
  vars:
    finding_id: '3322011750'
    finding_path: internal/stable/supervisor.go
    finding_line: '1343'
    line_start: '1337'
    line_end: '1357'
    finding_created: '2026-06-01T00:00:00Z'
    finding_body: 'Race condition in RuntimeSendToParent timer closure: the `requestID`
      variable is captured by reference in the `time.AfterFunc` closure.'
    current_code: "\ts.controlMu.Lock()\n\ts.childQuestionSeq++\n\trequestID := fmt.Sprintf(\"\
      cq_%d\", s.childQuestionSeq)\n\t// ... setup pendingQuestions ...\n\ttimer :=\
      \ time.AfterFunc(s.childQuestionTimeout, func() {\n\t\ts.controlMu.Lock()\n\t\
      \tpq, ok := s.pendingQuestions[rtID]\n\t\tif !ok || pq.requestID != requestID\
      \ {\n\t\t\ts.controlMu.Unlock()\n\t\t\treturn\n\t\t}\n\t\tdelete(s.pendingQuestions,\
      \ rtID)\n\t\ts.controlMu.Unlock()\n\t\t_ = s.RuntimePrompt(rtID, fmt.Sprintf(\"\
      No parent response received within %s. Continue with your best judgment and\
      \ state assumptions.\", s.childQuestionTimeout), requestID)\n\t})\n\ts.pendingQuestions[rtID]\
      \ = pendingChildQuestion{requestID: requestID, timer: timer}\n\ts.controlMu.Unlock()\n"
    discussion:
    - author: sdougbrown
      body: '`👾 AI Agent` Leaving as-is. This is a false positive: `requestID` is
        function-local and not reassigned after creation. The timer closure captures
        that immutable value for this invocation, so there is no cross-request race
        from variable reuse.'
  assert:
  - type: javascript
    value: 'output.includes(''"classification": "still_valid"'') || output.includes(''"classification":"still_valid"'')'
  # Production end-to-end: this raw output survives validation iff the
  # still_valid carried a path:line citation, or the validator downgraded to
  # uncertain while preserving the accepted disposition (umpire-bot#77).
  - type: javascript
    value: |-
      return (() => {
        const cls = output.match(/"classification"\s*:\s*"([^"]*)"/);
        const ev = output.match(/"evidence"\s*:\s*"((?:[^"\\]|\\.)*)"/);
        const dis = output.match(/"disposition"\s*:\s*"([^"]*)"/);
        if (!cls || !dis) return false;
        const cited = ev && /[A-Za-z0-9_@.\/\\-]+\.[A-Za-z0-9]{1,8}:[0-9]{1,6}/.test(ev[1]);
        if (cls[1] === "still_valid") {
          // Cited: stands as-is. Uncited: downgraded to uncertain, accepted
          // disposition preserved (validateAndClassify).
          return cited || dis[1] === "accepted";
        }
        return cls[1] === "uncertain" && dis[1] === "accepted";
      })()
  - type: javascript
    value: 'output.includes(''"disposition": "accepted"'') || output.includes(''"disposition":"accepted"'')'
