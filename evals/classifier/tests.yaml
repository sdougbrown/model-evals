- description: 'avenor/34: WaitForDone subscription leak — fixed with scoped context'
  vars:
    finding_id: '3322114846'
    finding_path: internal/runtime/pony/config.go
    finding_line: '130'
    finding_created: '2026-06-01T00:00:00Z'
    finding_body: '`WaitForDone` subscribes with `SubscribeRuntime(ctx, sessionID)`
      but never unsubscribes or closes the subscription after returning. This leaks
      subscriber resources on the client side over time.'
    current_code: "func (e *controlSocketExecutor) WaitForDone(ctx context.Context,\
      \ sessionID string) (*runtime.AgentResult, error) {\n\tsubCtx, cancel := context.WithCancel(ctx)\n\
      \tdefer cancel()\n\tsub := e.client.SubscribeRuntime(subCtx, sessionID)\n\t\
      for evt := range sub {\n\t\tif evt.Event == \"session.end\" {\n\t\t\tstopReason,\
      \ _ := evt.Raw[\"stop_reason\"].(string)\n\t\t\texitCode := 0\n\t\t\tif ec,\
      \ ok := evt.Raw[\"exit_code\"].(float64); ok {\n\t\t\t\texitCode = int(ec)\n\
      \t\t\t}\n"
    discussion:
    - author: sdougbrown
      body: '`👾 AI Agent` Fixed in 7e63102. `WaitForDone` now creates a scoped subscription
        context (`subCtx`) and calls `cancel()` on return, which unregisters/closes
        the runtime subscription promptly and avoids subscriber buildup.'
  assert:
  - type: javascript
    value: 'output.includes(''"classification": "fixed"'') || output.includes(''"classification":"fixed"'')'
  - type: javascript
    value: 'output.includes(''"disposition": "no_action"'') || output.includes(''"disposition":"no_action"'')'
- description: 'avenor/34: spawnAgents ''concurrently'' vs sequential loop — design
    rationale'
  vars:
    finding_id: '3322011710'
    finding_path: internal/runtime/pony/agent_tools.go
    finding_line: '111'
    line_start: '105'
    line_end: '125'
    finding_created: '2026-06-01T00:00:00Z'
    finding_body: spawnAgentsTool runs agents sequentially in a for loop despite the
      description saying 'All agents run concurrently.'
    current_code: "func (t *spawnAgentsTool) Description() string {\n\treturn \"Create\
      \ multiple child agent sessions in a single call. All agents run concurrently.\
      \ Returns session IDs with labels for each spawned agent.\"\n}\n// ... Execute\
      \ method:\n\tfor _, agent := range input.Agents {\n\t\tsessionID, err := t.executor.SpawnAgent(ctx,\
      \ params)\n\t\tif err != nil {\n\t\t\treturn \"\", fmt.Errorf(\"spawn_agents:\
      \ %w\", err)\n\t\t}\n\t\tparts = append(parts, desc)\n\t}\n\treturn \"Spawned\
      \ agents: [\" + strings.Join(parts, \", \") + \"]\", nil\n"
    discussion:
    - author: sdougbrown
      body: '`👾 AI Agent` Leaving as-is by design. `spawn_agents` dispatches spawn
        RPCs sequentially, but each spawned runtime starts immediately and runs concurrently
        in the supervisor. The wording "run concurrently" describes runtime execution,
        not concurrent client-side RPC issuance.'
  assert:
  - type: javascript
    value: 'output.includes(''"classification": "still_valid"'') || output.includes(''"classification":"still_valid"'')'
  - type: javascript
    value: |-
      return (() => {
        const m = output.match(/"evidence"\s*:\s*"((?:[^"\\]|\\.)*)"/);
        if (!m) return false;
        return /[A-Za-z0-9_@.\/\\-]+\.[A-Za-z0-9]{1,8}:[0-9]{1,6}/.test(m[1]);
      })()
  - type: javascript
    value: 'output.includes(''"disposition": "accepted"'') || output.includes(''"disposition":"accepted"'')'
