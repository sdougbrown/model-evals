- description: 'citation/2: fixed — guard added at anchor, no citation required'
  vars:
    finding_id: '9900000002'
    finding_path: internal/store/lease.go
    finding_line: '88'
    line_start: '84'
    line_end: '104'
    finding_created: '2026-09-01T00:00:00Z'
    finding_body: '`renewLease` dereferences `lease.Expiry` without a nil check; a lease
      removed by a concurrent `revoke` panics here.'
    current_code: |
      func (s *Store) renewLease(lease *Lease) error {
      	s.mu.Lock()
      	defer s.mu.Unlock()
      	if lease == nil {
      		return ErrLeaseMissing
      	}
      	if time.Now().After(lease.Expiry) {
      		return ErrLeaseExpired
      	}
      	lease.Expiry = time.Now().Add(leaseTTL)
      	return nil
      }
    discussion:
    - author: sdougbrown
      body: '`👾 AI Agent` Fixed in 1a2b3c4. `renewLease` now returns
        `ErrLeaseMissing` for a nil lease before touching `lease.Expiry`.'
  assert:
  - type: javascript
    value: 'output.includes(''"classification": "fixed"'') || output.includes(''"classification":"fixed"'')'

