# Classifier eval — gemma4 26b (gateway model id "gemma4") only
description: "Classifier: finding re-classification (fixed / still_valid + disposition)"

evaluateOptions:
  maxConcurrency: 3

providers:
  - id: openai:chat:gemma4
    label: gemma4 (26b)
    config:
      apiBaseUrl: "http://localhost:4000/v1"
      apiKey: none
      model: gemma4
      max_tokens: 1024
      temperature: 0
      # Production classifier sends chat_template_kwargs via
      # CLASSIFIER_CHAT_TEMPLATE_KWARGS; the gateway accepts it as-is.
      chat_template_kwargs: {"enable_thinking": false}

prompts:
  - file://prompt.js

# Shared case set: original avenor cases (with still_valid citation
# assertions) plus the citation-rule cases added for umpire-bot#77.
tests: file://tests.yaml
